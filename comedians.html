<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comedians A–Z — The Giggling Cult</title>
  <meta name="description" content="Every South African stand-up comedian on The Giggling Cult, A to Z. Bios, provinces, social links and upcoming shows.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header id="site-nav"></header>

  <main>
    <section class="page-head">
      <div class="container">
        <span class="eyebrow enter" style="--i:0">Comedians</span>
        <h1 class="enter" style="--i:1">The congregation, A to Z.</h1>
        <p class="enter" style="--i:2">Every comic on the platform: the household names, the club regulars, and the newcomers we're betting on. Tap a letter to jump, tap a face for the full confession.</p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <!-- A–Z navigation: every letter always visible -->
        <nav class="alpha-nav enter" style="--i:3" id="alpha-nav" aria-label="Browse by first letter"></nav>

        <!-- Province + rising filters, visually separated from the letter nav -->
        <div class="filter-bar enter" style="--i:4">
          <div class="filter-group">
            <span class="filter-label">Province</span>
            <span class="filter-sep"></span>
            <div class="filter-group" id="province-chips"></div>
          </div>
          <div class="filter-group">
            <span class="filter-sep"></span>
            <label class="check"><input type="checkbox" id="rising-only"> Rising stars only</label>
          </div>
          <span class="filter-result" id="filter-result"></span>
        </div>

        <div class="grid grid-3 swap" id="comedian-grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/comedians.js"></script>
</body>
</html>
