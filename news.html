<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News — The Giggling Cult</title>
  <meta name="description" content="The latest South African comedy news: announcements, venues, festivals and the comics to watch.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header id="site-nav"></header>

  <main>
    <!-- Listing -->
    <div id="news-list">
      <section class="page-head">
        <div class="container">
          <span class="eyebrow enter" style="--i:0">News</span>
          <h1 class="enter" style="--i:1">Hot off the mic.</h1>
          <p class="enter" style="--i:2">Announcements, venue drama, festival line-ups and who's selling out where. Roughly 40% more accurate than the group chat.</p>
        </div>
      </section>

      <section class="section" style="padding-top:0">
        <div class="container">
          <div class="filter-bar enter" style="--i:3">
            <div class="filter-group">
              <span class="filter-label">Topic</span>
              <span class="filter-sep"></span>
              <div class="filter-group" id="topic-chips"></div>
            </div>
            <span class="filter-result" id="filter-result"></span>
          </div>
          <div class="grid grid-3 swap" id="news-grid"></div>
        </div>
      </section>
    </div>

    <!-- Single article -->
    <div id="news-article" hidden>
      <section class="section">
        <div class="container article" id="article-body"></div>
      </section>
      <section class="section">
        <div class="container">
          <div class="section-head"><div><span class="eyebrow">Still here?</span><h2>Keep reading, then</h2></div></div>
          <div class="grid grid-3" id="article-more"></div>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/news.js"></script>
</body>
</html>
